:root {
  --bg: #101215;
  --bg-rgb: 16 18 21;
  --surface: #15181c;
  --surface-2: #1b1f24;
  --line: #262a31;
  --text: #e8ecf2;
  --heading: var(--text);
  --prose: #cfd3da;
  --muted: #abadb0;
  --faint: #7d8087;
  --peri: #9fb4ff;
  --white: #eef2f8;
  --mint: #a8e6ed;
  --brace: #8b9de8;
  --ember: var(--peri);
  --ember-2: var(--mint);
  --on-ember: #101215;
  --on-accent: #101215;
  --code: var(--mint);
  --grad: linear-gradient(100deg, var(--peri) 0%, var(--white) 50%, var(--mint) 100%);
  --font-display: 'Space Grotesk', -apple-system, 'Helvetica Neue', sans-serif;
  --font-ui: var(--font-display);
  --font-mono: 'JetBrains Mono', Menlo, monospace;
  /* The names our own parts use. */
  --display: var(--font-display);
  --ui: var(--font-ui);
  --mono: var(--font-mono);
}

h1,
h2,
h3 {
  font-family: var(--font-display);
  line-height: 1.1;
}

.display {
  font-family: var(--font-display);
  font-weight: 700;
  color: inherit;
  letter-spacing: -0.02em;
  line-height: 1.02;
  text-shadow: none;
}

/* Gradient title text, as on the thumbnails. */
.grad {
  width: fit-content;
  background: var(--grad);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

/* Kicker tags: small mono labels in thin outlines, the first in periwinkle. */
.tags {
  gap: 8px;
}
.tags > *,
.tags > :last-child {
  font-family: var(--font-mono);
  font-size: 0.78rem;
  letter-spacing: 0.08em;
  padding: 0.5em 0.75em;
  border: 1px solid var(--line);
  color: var(--muted);
  background: rgb(16 18 21 / 0.6);
}
.tags > :first-child {
  border-color: rgb(159 180 255 / 0.45);
  color: var(--peri);
}

/* A hero with the soft glow behind its title. */
.glow {
  position: relative;
  isolation: isolate;
  border-bottom: 1px solid var(--line);
  overflow: hidden;
}
.glow::before {
  content: '';
  position: absolute;
  z-index: -2;
  inset: -30% -10% -30% 25%;
  background:
    radial-gradient(closest-side at 55% 50%, rgb(159 180 255 / 0.1), transparent),
    radial-gradient(closest-side at 75% 55%, rgb(168 230 237 / 0.06), transparent);
  pointer-events: none;
}

.section-title {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 1.6rem;
  letter-spacing: -0.01em;
}

/* The bar: in the page's flow, frosted, sliding away while scrolling down. */
.bar {
  position: sticky;
  top: 0;
  z-index: 5;
  background: rgb(16 18 21 / 0.72);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--line);
  transition: transform 200ms ease;
}
.bar-inner {
  padding-block: 14px;
}
.brand {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 1.3rem;
  letter-spacing: -0.02em;
  text-shadow: none;
}
.curly {
  color: var(--brace);
  font-weight: 400;
}
.curly:first-child {
  margin-right: 0.08em;
}
.curly:last-child {
  margin-left: 0.08em;
}
/* The links in a line on wider screens; on a phone they're aphrodite's menu, a link a row. */
@media (min-width: 721px) {
  .bar nav {
    flex-wrap: nowrap;
    gap: clamp(14px, 3vw, 28px);
  }
}
.bar nav a {
  color: var(--muted);
}
.bar nav a:hover,
.menu:hover {
  color: var(--white);
}

/* Episode cards: lifting with a glow. */
.card {
  overflow: hidden;
  box-shadow: none;
  transition:
    transform 150ms ease,
    border-color 150ms ease,
    box-shadow 150ms ease;
}
.card:hover {
  border-color: rgb(159 180 255 / 0.5);
  box-shadow: 0 10px 40px -12px rgb(159 180 255 / 0.25);
  transform: translateY(-2px);
}
.card .placeholder {
  background: radial-gradient(closest-side, rgb(159 180 255 / 0.1), transparent) var(--bg);
}
.card .placeholder span,
.player.draft .display {
  background: var(--grad);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
.card .placeholder span {
  font-size: clamp(1.5rem, 3.4vw, 2rem);
}
.card .tags > * {
  font-size: 0.78rem;
  border-width: 1px;
}
.card h3 {
  font-weight: 600;
}

/* The player: square, with a square play button, and a mini player that pops in. */
.player {
  overflow: hidden;
  box-shadow: 0 20px 60px -24px rgb(159 180 255 / 0.25);
}
.player.draft {
  background: radial-gradient(closest-side, rgb(159 180 255 / 0.1), transparent) var(--bg);
}
.player.draft p {
  background: none;
}
.screen.docked {
  z-index: 4;
  animation: pop 180ms ease-out;
}
.docked .frame {
  box-shadow:
    0 18px 48px -12px rgb(0 0 0 / 0.7),
    0 0 0 1px rgb(159 180 255 / 0.12);
}
@keyframes pop {
  from {
    opacity: 0;
    scale: 0.96;
  }
}
@media (prefers-reduced-motion: reduce) {
  .screen.docked {
    animation: none;
  }
}
.close {
  top: -11px;
  right: -11px;
}
.corner .close {
  right: -6px;
}
.close:hover {
  color: var(--white);
  border-color: rgb(159 180 255 / 0.5);
}
.close svg,
.menu svg:not(.open-icon),
.search-close svg {
  fill: none;
  stroke: currentColor;
  stroke-width: 1.8;
  stroke-linecap: square;
}
.start .play {
  width: 76px;
  height: 76px;
  color: var(--peri);
  filter: drop-shadow(0 6px 24px rgb(0 0 0 / 0.5));
  transition:
    color 150ms ease,
    scale 150ms ease;
}
.docked .start .play {
  width: 48px;
  height: 48px;
}
.start:hover .play,
.start:focus-visible .play {
  color: var(--mint);
  scale: 1.06;
}

/* An episode page: quiet times, thin rules. */
.time {
  color: var(--faint);
}
a.time:hover {
  color: var(--mint);
  text-decoration: none;
}
.chapters {
  border-left-width: 1px;
}
.chapters a:hover {
  box-shadow: -2px 0 0 var(--peri);
}
.pager a:hover {
  border-color: rgb(159 180 255 / 0.5);
}

/* Square corners everywhere, form controls too, whatever the browser draws by default. */
button,
input,
textarea,
select {
  border-radius: 0;
}
